// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 21
        compileSdkVersion = 36
        targetSdkVersion = 29

        ndkVersion = "26.1.10909125"
        // 2.3.10: io.github.kyant0:backdrop:1.0.6 is compiled with Kotlin 2.3.10,
        // so the compiler has to be at least that version to read its metadata.
        // KSP must use the matching release (KSP now shares Kotlin's version number).
        kotlinVersion = "2.3.10"
        RNNKotlinVersion = kotlinVersion

        // https://github.com/DylanVann/react-native-fast-image/blob/9ab80fcd570b7f56da66ab20e52c9a35934067c9/docs/app-glide-module.md
        // https://github.com/dream-horizon-org/react-native-fast-image/blob/main/docs/app-glide-module.md
        excludeAppGlideModule = true
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // 8.12.3: KSP 2.3.x 需要 AGP 的 AndroidComponentsExtension.addKspConfigurations
        // （8.9+ 才有）；而 8.13 已移除 RN 0.73 插件依赖的
        // com.android.build.gradle.internal.tasks.factory.dependsOn，8.12.3 是同时满足两者的版本。
        classpath('com.android.tools.build:gradle:8.12.3')
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

apply plugin: "com.facebook.react.rootproject"

/**
 * 统一所有模块的 Java / Kotlin 字节码目标为 17。
 *
 * 背景：gradle.properties 里关掉了 RN 的自动版本对齐
 * （react.internal.disableJavaVersionAlignment=true，Kotlin 2.x 下那段对齐代码会崩），
 * 于是各第三方库回到自己的默认值，出现两类互相独立的编译错误：
 *   1. react-native-pager-view / webview / video：Java 是 1.8 或 11，Kotlin 是 17，
 *      KGP 直接报 "Inconsistent JVM-target compatibility"；
 *   2. @d11/react-native-fast-image：源码用了 instanceof 模式匹配（Java 16+），
 *      却在 -source 8 下编译，报 "不支持 instanceof 中的模式匹配"。
 * 这里统一覆盖为 17，两个方向都对齐。
 *
 * 两个实现细节：
 *  - Java 侧用 AGP 的 androidComponents.finalizeDsl：它保证在模块自己的
 *    compileOptions（pager-view 写 1.8、video 写 11）之后才生效；
 *    这里刻意不用 subproject.afterEvaluate——RN 的 root plugin 会让每个库
 *    evaluationDependsOn(":app")，求值到本脚本时 :app 已经求值完毕，
 *    再对它调 afterEvaluate 会直接抛 "project is already evaluated"。
 *  - Kotlin 侧按任务名匹配 + 动态属性访问，不用 tasks.withType(KotlinCompile)：
 *    async-storage 在自己的 buildscript 里单独引入了 kotlin-gradle-plugin，
 *    类型可能来自不同的 classloader，withType 匹配不到。
 */
subprojects { subproject ->
    def alignJavaTarget = { Project p ->
        def componentsExt = p.extensions.findByName('androidComponents')
        if (componentsExt != null) {
            componentsExt.finalizeDsl { androidDsl ->
                androidDsl.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
                androidDsl.compileOptions.targetCompatibility = JavaVersion.VERSION_17
            }
        }
    }
    subproject.pluginManager.withPlugin('com.android.application') { alignJavaTarget(subproject) }
    subproject.pluginManager.withPlugin('com.android.library') { alignJavaTarget(subproject) }

    subproject.tasks.matching { it.name ==~ /compile[A-Za-z0-9_]*Kotlin/ }.configureEach { t ->
        if (t.hasProperty('kotlinOptions')) {
            t.kotlinOptions.jvmTarget = '17'
        }
    }
}
